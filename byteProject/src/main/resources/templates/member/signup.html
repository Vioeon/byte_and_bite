<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
<div class="wrapper">
    <!-- 슬로건 -->
    <div class="slogan">
        <p>맛있는 한입을<br>함께 나누다.</p>
        <h1>Byte &amp; Bite</h1>
    </div>
    <!-- 회원가입 박스 -->
    <div class="signup-box">
        <h2>회원가입</h2>

        <form action="signup" method="post" th:object="${signupForm}">
            <input type="text" th:field="*{nickname}" placeholder="nickname" required>
            <input type="email" th:field="*{email}" placeholder="Email" required>
            <input type="password" th:field="*{password}" placeholder="Password" required>
            <input type="password" th:field="*{passwordConfirm}" placeholder="Password 확인" required>

            <div class="field-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <div class="member-type">
                <label>
                    <input type="radio" th:field="*{role}" value="0" checked>사용자
                </label>

                <label>
                    <input type="radio" th:field="*{role}" value="1">식당 관계자
                </label>
            </div>

            <button type="submit">회원가입</button>
        </form>

        <div class="links">
            <span>이미 계정이 있으신가요?</span>
            <a href="/member/login">로그인</a>
        </div>
    </div>
</div>
</body>
</html>

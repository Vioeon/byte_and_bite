<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet" th:href="@{/css/resSignup.css}">
</head>
<body>
<div class="wrapper">
    <!-- 슬로건 -->
    <div class="slogan">
        <p>맛있는 한입을<br>함께 나누다.</p>
        <h1>Byte &amp; Bite</h1>
    </div>
    <!-- 회원가입 박스 -->
    <div class="signup-box">
        <h2>식당 정보 등록</h2>

        <form>
            <input type="text" placeholder="식당명" required>
            <input type="text" placeholder="식당 주소" required>
            <div class="links">
                <select>
                    <!-- value : 선택 시 서버로 전송되는 값 -->
                    <option value="">식당 카테고리</option>
                    <option value="">한식</option>
                    <option value="">중식</option>
                    <option value="">양식</option>
                    <option value="">일식</option>
                </select>
            </div>
            <input type="text" placeholder="전화번호" required>

            <button type="submit">식당 등록</button>
        </form>

        <div class="links">
            <span>이미 계정이 있으신가요?</span>
            <a href="/bytebite/member/login">로그인</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<div class="mypage-container">
    <!-- 1. 헤더 영역 -->
    <header class="mypage-header">
        <h1>마이페이지</h1>
    </header>

    <!-- 2. 회원 정보 섹션 -->
    <section class="profile-section">
        <div class="profile-card">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
                <h2><span th:text="${user.name}">홍길동</span>님 반가워요!</h2>
                <p class="email" th:text="${user.email}">hong@example.com</p>
                <p class="join-date">가입일: <span th:text="${user.joinDate}">2026-01-01</span></p>
            </div>
            <div class="profile-actions">
                <a href="/mypage/edit" class="btn btn-secondary">회원정보 수정</a>
            </div>
        </div>
    </section>

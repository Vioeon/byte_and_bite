<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>byte&bite</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff;
            color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        /* 공통 중앙 정렬 레이아웃 (최대 너비 1200px) */
        .wrapper {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
        }

        /* 1. 최상단 헤더 영역 */
        header {
            width: 100%;
            border-bottom: 2px solid #000;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            border: 2px solid #000;
            background: #fff;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 2. 네비게이션 & 정렬 옵션 */
        nav {
            width: 100%;
            border-bottom: 2px solid #000;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            font-size: 18px;
            padding: 12px 24px;
            cursor: pointer;
            color: #666;
            font-weight: 500;
        }

        /* 활성화된 탭 */
        .tab.active {
            border: 2px solid #000;
            border-bottom: 2px solid #fff;
            margin-bottom: -2px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border-radius: 6px 6px 0 0;
        }

        /* 라디오 버튼 정렬 옵션 */
        .sort-options {
            display: flex;
            gap: 16px;
            padding-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        .sort-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .sort-options input[type="radio"] {
            accent-color: #000; /* 깔끔한 라디오 버튼 스타일 */
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 3. 메인 콘텐츠 영역 */
        main {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 검색바 영역 */
        .search-bar {
            display: flex;
            gap: 12px;
        }

        /* 드롭다운 select 스타일 */
        .category-select {
            border: 2px solid #000;
            background: #fff;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .search-bar input {
            border: 2px solid #000;
            background: #fff;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 6px;
            outline: none;
        }

        .search-input {
            flex: 1;
            text-align: left; /* 텍스트 입력이 자연스럽도록 좌측 정렬 */
        }

        .btn-search {
            border: 2px solid #000;
            background: #fff;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 리뷰 작성 버튼 링크 스타일 */
        .btn-write-link {
            text-decoration: none;
        }

        .btn-write {
            border: 2px solid #000;
            background-color: #f5f5f5;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            height: 100%;
        }

        /* 3x3 카드 그리드 레이아웃 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* 카드 개별 링크 스타일 */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* 통일된 카드 스타일 */
        .card {
            border: 2px solid #000;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 8px;
            background-color: #fff;
            height: 360px;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .card-link:hover .card {
            background-color: #fafafa;
            border-width: 3px;
            padding: 15px;
        }

        .card-img {
            border: 2px solid #000;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            border-radius: 6px;
            background-color: #f0f0f0;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 2px 2px;
        }

        .card-info .restaurant-name {
            font-size: 18px;
            font-weight: bold;
        }

        .card-info .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
        }

        .card-title {
            border: 2px solid #000;
            text-align: center;
            padding: 8px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: auto;
            background-color: #fff;
        }

        /* 4. 하단 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pagination button {
            border: 2px solid #000;
            background: #fff;
            padding: 8px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>

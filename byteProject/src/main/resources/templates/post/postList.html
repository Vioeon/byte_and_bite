<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>byte&bite</title>
    <link rel="stylesheet" th:href="@{/css/postList.css}">
</head>
<body>

<!-- 1. 최상단 헤더 -->
<header>
    <div class="wrapper header-content">
        <div class="logo">byte&bite</div>
        <div class="auth-buttons">
            <button type="button">로그인</button>
            <button type="button">회원가입</button>
        </div>
    </div>
</header>

<!-- 2. 네비게이션 & 정렬 -->
<nav>
    <div class="wrapper nav-content">
        <div class="tabs">
            <div class="tab active">맛집 리뷰</div>
            <div class="tab">맛집 소식</div>
            <div class="tab">마이페이지</div>
        </div>
        <div class="sort-options">
            <label>
                <input type="radio" name="sort" value="latest" checked> 최신순
            </label>
            <label>
                <input type="radio" name="sort" value="views"> 조회순
            </label>
        </div>
    </div>
</nav>

<!-- 3. 메인 콘텐츠 -->
<main class="wrapper">
    <!-- 검색바 -->
    <form class="search-bar" action="/search" method="GET">
        <select class="category-select" name="category">
            <option value="all">전체 카테고리</option>
            <option value="korean">한식</option>
            <option value="western">양식</option>
            <option value="chinese">중식</option>
            <option value="japanese">일식</option>
            <option value="etc">기타</option>
        </select>

        <input type="text" class="search-input" name="keyword" placeholder="리뷰 제목을 입력해주세요.">

        <button type="submit" class="btn-search">검색</button>

        <a href="/write" class="btn-write-link">
            <button type="button" class="btn-write">리뷰작성</button>
        </a>
    </form>

    <!-- 3x3 동적 카드 그리드 -->
    <section class="card-grid">

        <!-- DB에서 가져온 개수만큼 카드가 동적으로 반복 생성됩니다 -->
        <a th:each="review : ${reviews}"
           th:href="@{/detail(id=${review.id})}"
           class="card-link">
            <div class="card">
                <div class="card-img">이미지</div>
                <div class="card-info">
                    <div class="restaurant-name" th:text="${review.restaurantName}">식당 이름</div>
                    <div class="row">
                        <span th:text="${review.category}">카테고리</span>
                        <span th:text="'조회수 ' + ${review.views}">조회수 0</span>
                    </div>
                </div>
                <div class="card-title" th:text="${review.title}">리뷰 제목</div>
            </div>
        </a>

        <!-- 데이터가 아예 없을 때 예외 처리 -->
        <div th:if="${#lists.isEmpty(reviews)}" style="grid-column: 1 / -1; text-align: center; padding: 50px 0; font-size: 18px; font-weight: bold;">
            등록된 리뷰가 없습니다.
        </div>

    </section>

    <!-- 페이지네이션 -->
    <div class="pagination">
        <button type="button">&lt;</button>
        <span>1</span>
        <button type="button">&gt;</button>
    </div>
</main>

</body>
</html>

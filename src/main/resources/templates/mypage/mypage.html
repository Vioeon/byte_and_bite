<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>byte&bite - 마이페이지</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div th:replace="~{layout/common :: nav-header}"></div>
<main class="wrapper">

    <!-- 내 정보 카드 -->
    <section class="profile-card">
        <div class="profile-info">
            <h2>
                <!-- 닉네임 th 필드 설정 -->
                <span name="nickname">bytebite</span>
                <button type="button" class="btn-sm" onclick="openModal()">닉네임 변경</button>
            </h2>
            <!-- 이메일 th 필드 설정 -->
            <div class="email" name="email">이메일</div>
        </div>

        <div class="profile-stats">
            <div class="stat-item">
                <span class="stat-label">작성한 리뷰</span>
                <span class="stat-value" name="th:text=${posts != null ? posts.size() : 0}">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">가입일</span>
                <!-- 가입일 th 필드 설정 -->
                <span class="stat-value" name="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2026-07-28</span>
            </div>
        </div>
    </section>

    <!-- 작성한 리뷰 -->
    <section class="posts-section">
        <div class="section-header">
            <div class="section-title">
                작성한 리뷰
                <span class="count-badge" name="${posts != null ? posts.size() : 0}">0</span>
            </div>
        </div>

        <div class="posts-list">
            <div class="post-item" th:each="post : ${posts}">
                <div class="post-img" th:text="${post.hasImage ? '이미지' : '노이미지'}">
                    이미지
                </div>
                <div class="post-main-content">
                    <a th:href="@{/post/detail/{id}(id=${post.id})}" class="post-title-link">
                        <h3 class="post-title" th:text="${post.title}">리뷰 제목이 들어가는 위치입니다.</h3>
                    </a>
                    <span class="restaurant-tag" th:text="${post.rname}">식당 이름</span>
                </div>
                <div class="post-meta">
                    <span class="post-date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2026-07-29</span>
                    <div class="post-actions">
                        <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn-action">수정</a>
                        <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn-action">삭제</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="empty-box" th:if="${posts == null or #lists.isEmpty(posts)}">
                작성한 리뷰가 없습니다.
            </div>
        </div>

        <div class="pagination" th:if="${posts != null and not #lists.isEmpty(posts)}">
            <button>&lt;</button>
            <span>1</span>
            <button>&gt;</button>
        </div>
    </section>

    <!-- 회원 탈퇴 -->
    <div class="account-action">
        <form th:action="@{/member/withdraw}" method="post">
            <button type="submit" class="btn-unregister" onclick="return confirm('정말 탈퇴하시겠습니까?');">회원 탈퇴하기</button>
        </form>
    </div>

</main>

<!-- 닉네임 변경 모달 -->
<div class="modal-overlay" id="nicknameModal" th:classappend="${nicknameError != null} ? 'active' : ''">
    <div class="modal-content">
        <h3>닉네임 변경</h3>

        <form th:action="@{/member/nickname}" method="post">
            <div class="modal-body">
                <input type="text" id="newNickname" name="newNickname"
                       th:value="${newNickname}"
                       placeholder="변경할 닉네임 입력" required>

                <div class="error-message" th:if="${nicknameError != null}" th:text="${nicknameError}">
                    이미 존재하는 닉네임입니다.
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                <button type="submit" class="btn-submit">변경</button>
            </div>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById('nicknameModal');

    function openModal() {
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
        const errorMsg = modal.querySelector('.error-message');
        if (errorMsg) errorMsg.style.display = 'none';
    }
</script>

</body>
</html>

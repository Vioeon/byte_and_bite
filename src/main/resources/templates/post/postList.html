<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <title>Byte&Bite - 맛집 리뷰</title>
    <link rel="stylesheet" th:href="@{/css/postList.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div th:replace="~{layout/common :: nav-header}"></div>
<main class="wrapper">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <div class="sort-options">
            <label>
                <input type="radio" name="sort" value="latest" checked> 최신순
            </label>
            <label>
                <input type="radio" name="sort" value="views"> 조회순
            </label>
        </div>
    </div>

    <!-- 검색바 -->
    <form class="search-bar" action="/search" method="GET" onsubmit="return false;">
        <select class="category-select" name="category">
            <option value="all">전체 카테고리</option>
            <option value="korean">한식</option>
            <option value="western">양식</option>
            <option value="chinese">중식</option>
            <option value="japanese">일식</option>
            <option value="etc">기타</option>
        </select>

        <input type="text" class="search-input" name="keyword" placeholder="리뷰 제목을 입력해주세요.">

        <button type="submit" class="btn-search">검색</button>

        <a href="@{/posts/write}" class="btn-write-link">
            <button type="button" class="btn-write">리뷰작성</button>
        </a>
    </form>

    <!-- 3x3 카드 그리드 -->
    <section class="card-grid">
        <!-- DB에서 가져온 개수만큼 카드가 동적으로 반복 생성됩니다 -->
        <a th:each="post : ${posts}"
           th:href="@{/posts/{postId}(postId=${post.id})}"
           class="card-link">
            <div class="card">
                <div class="card-img">이미지</div>
                <div class="card-info">
                    <div class="restaurant-name" th:text="${post.restaurantName}">식당 이름</div>
                    <div class="row">
                        <span th:text="${post.category}">카테고리</span>
                        <span th:text="'조회수 ' + ${post.views}">조회수 0</span>
                    </div>
                </div>
                <div class="card-title" th:text="${post.title}">리뷰 제목</div>
            </div>
        </a>

        <!-- 데이터가 아예 없을 때 예외 처리 -->
        <div th:if="${#lists.isEmpty(posts)}" style="grid-column: 1 / -1; text-align: center; padding: 50px 0; font-size: 18px; font-weight: bold;">
            등록된 리뷰가 없습니다.
        </div>
    </section>

    <!-- 페이지네이션 -->
    <div class="pagination" th:if="${posts != null and not #lists.isEmpty(posts)}">
        <button><</button>
        <span>1</span>
        <button>></button>
    </div>
</main>
</body>
</html>

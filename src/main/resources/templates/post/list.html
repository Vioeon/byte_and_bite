<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스프링 게시판 - 목록</title>
    <link rel="stylesheet" href="/board/css/common.css">
    <link rel="stylesheet" href="/board/css/list.css">
</head>
<body>
<div class="container">
    <th:block th:insert="~{layout/common :: nav-header('게시글 목록')}">
        <h1>게시글 상세 정보</h1>
        <div class="nav">
            <a href="/post/list.html">목록으로</a>
            <a href="/post/write.html">새 글 쓰기</a>
        </div>
    </th:block>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일시</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">3</td>
            <td>
                <a th:href="@{detail.html(id=${post.id})}" th:text="${post.title}">세 번째 게시글 제목 샘플</a>
            </td>
            <td th:text="${post.nickname}">닉네임</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-13 15:30</td>
            <td>
                <form th:action="@{delete(id=${post.id})}" method="post">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </td>

        </tr>

        </tbody>
    </table>
</div>
</body>
</html>

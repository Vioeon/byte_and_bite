<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스프링 게시판 - 목록</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/board/css/common.css">
    <link rel="stylesheet" href="/board/css/list.css">
</head>
<body>
<div class="container">
    <th:block th:insert="~{layout/common :: nav-header}">
        <h1>게시글 상세 정보</h1>
        <div class="nav">
            <a href="/posts">목록으로</a>
            <a href="/posts/write">새 글 쓰기</a>
        </div>
    </th:block>
    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일시</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">3</td>
            <td>
                <a th:href="@{/posts/{postId}(postId=${post.id})}" th:text="${post.title}"></a>
            </td>
            <td th:text="${post.nickname}">닉네임</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/delete(id=${post.id})}" method="post">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

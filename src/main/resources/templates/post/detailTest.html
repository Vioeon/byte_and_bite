<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>맛집 리뷰 상세</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/postDetail.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <script th:src="@{/js/reply.js}" defer></script>
</head>
<body>

<div th:replace="~{layout/common :: nav-header}"></div>
<main class="detail-wrapper">

    <!-- 식당 정보 -->
    <section class="restaurant-box">
        <div class="restaurant-image">
            <img th:src="${post.restaurantImage}" alt="식당 이미지">
        </div>

        <div class="restaurant-info">
            <h1 th:text="${post.restaurantName}">식당명</h1>
            <div class="restaurant-category" th:text="${post.categoryName}"></div>
            <div class="restaurant-detail">
                <p th:text="'📍' + ${post.address}">주소</p>
                <p th:text="'☎ ' + ${post.phone}">전화번호</p>
            </div>

        </div>
    </section>

    <!-- 맛집 리뷰 -->
    <section class="review-box">
        <div class="review-header">
            <h2 th:text="${post.title}">정말 맛있었던 인생 맛집 리뷰입니다!</h2>

            <div class="review-meta">
                <span>작성자 : <strong th:text="${post.nickname}">맛집탐방러</strong></span>
                <span th:text="'조회수 ' + ${post.views}">조회수 128</span>
                <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-02 14:30</span>
            </div>
        </div>

        <div class="review-image" th:each="image : ${images}">
            <img th:src="${image}" width="300">
        </div>

        <div class="review-content" th:text="${post.content}">
            음식이 정말 맛있었고 매장 내부 분위기도 아주 깔끔하고 좋았습니다.
            <br><br>
            특히 대표 메뉴가 입에서 살살 녹을 정도로 훌륭했으며, 직원분들도 친절하셔서 다음에도 다시 방문하고 싶은 찐 맛집입니다! 추천합니다.
        </div>

        <div class="review-buttons">
            <a th:href="@{/posts}" class="btn-action">목록</a>
            <th:block th:if="${session.loginMember != null and session.loginMember.memberId == post.memberId}">
                <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn-action">수정</a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn-action" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                </form>
            </th:block>
        </div>
    </section>

    <!-- 댓글 -->
    <section class="reply-box" id="reply-section">
        <h3>
            댓글 (<span th:text="${replyCount}">0</span>)
        </h3>

        <!-- 댓글 작성 폼 -->
        <th:block th:if="${session.loginMember != null}">
            <form th:action="@{/posts/{postId}/replies/write(postId=${post.id})}"
                  method="post"
                  class="reply-form">
                <textarea name="content" placeholder="댓글을 입력해주세요" required></textarea>
                <button type="submit">등록</button>
            </form>
        </th:block>

        <!-- 댓글 동적 렌더링 -->
        <div class="reply-list">
            <div class="reply-item" th:each="reply : ${replyList}">
                <div class="reply-header">
                    <strong th:text="${reply.nickname}">미식가A</strong>
                    <span th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-02 15:00</span>
                </div>
                <p class="reply-content" th:text="${reply.content}">
                    사진만 봐도 정말 군침이 도네요! 저도 주말에 가봐야겠습니다.
                </p>

                <!-- 댓글 작성자 버튼 -->
                <th:block th:if="${session.loginMember != null and session.loginMember.memberId == reply.memberId}">
                    <div class="reply-action">
                        <button type="button" class="reply-edit-btn" onclick="editReply(this)">수정</button>
                        <form th:action="@{/posts/{postId}/replies/{replyId}/delete(postId=${post.id}, replyId=${reply.replyId})}" method="post" style="display:inline;">
                            <button type="submit" class="reply-delete-btn" onclick="return confirm('댓글을 삭제하시겠습니까?');">
                                삭제
                            </button>
                        </form>
                    </div>
                </th:block>

                <!-- 댓글 수정 -->
                <form class="reply-edit-form"
                      th:action="@{/posts/{postId}/replies/{replyId}/edit(postId=${post.id}, replyId=${reply.replyId})}"
                      method="post" style="display:none;">
                    <textarea name="content" th:text="${reply.content}"></textarea>
                    <div class="reply-edit-buttons">
                        <button type="submit">
                            수정
                        </button>
                        <button type="button" onclick="cancelReplyEdit(this)">
                            취소
                        </button>
                    </div>
                </form>
            </div>
            <div th:if="${#lists.isEmpty(replyList)}">
                등록된 댓글이 없습니다.
            </div>
        </div>

        <!-- 댓글 페이징 -->
        <div class="pagination" th:if="${pageResponse != null and not #lists.isEmpty(replyList)}">

            <!-- 이전 -->
            <a th:if="${pageResponse.hasPrev}"
               th:href="@{/posts/{postId}(postId=${post.id}, page=${pageResponse.page - 1})}">
                &laquo; 이전
            </a>

            <!-- 페이지 번호 -->
            <th:block th:each="p : ${#numbers.sequence(pageResponse.startPage, pageResponse.endPage)}">

                <a th:if="${p != pageResponse.page}"
                   th:href="@{/posts/{postId}(postId=${post.id}, page=${p})}"
                   th:text="${p}">
                </a>

                <span th:if="${p == pageResponse.page}"
                      class="active"
                      th:text="${p}">
        </span>

            </th:block>

            <!-- 다음 -->
            <a th:if="${pageResponse.hasNext}"
               th:href="@{/posts/{postId}(postId=${post.id}, page=${pageResponse.page + 1})}">
                다음 &raquo;
            </a>

        </div>
    </section>
</main>
</body>
</html>

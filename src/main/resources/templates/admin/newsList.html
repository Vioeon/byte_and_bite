        <a th:each="post : ${news}"
           th:href="@{/detail(id=${post.newsId})}"
           class="card-link">
            <div class="card">
                <div class="card-img">이미지</div>
                <div class="card-info">
                    <div class="restaurant-name" th:text="${post.restaurantName}">식당 이름</div>
                    <div class="row">
                        <span th:text="${post.category}">카테고리</span>
                        <span th:text="'조회수 ' + ${post.views}">조회수 0</span>
                    </div>

            </div>
        </a>

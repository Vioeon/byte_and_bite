<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- 공통 GNB 조각 정의 -->
<th:block th:fragment="nav-header">
    <header>
        <div class="wrapper header-content">
            <div class="logo">Byte&Bite</div>
            <div class="auth-buttons">
                <!-- 로그인 안 된 경우 -->
                <th:block th:if="${session.loginMember == null}">
                    <a th:href="@{/member/login}">로그인</a>
                    <a th:href="@{/member/register}">회원가입</a>
                </th:block>
                <!-- 로그인 된 경우 -->
                <th:block th:if="${session.loginMember != null}">
                    <span class="user-welcome" th:text="${session.loginMember.nickname + '님'}">사용자님</span>
                    <form th:action="@{/member/logout}" method="post" style="display:inline;">
                        <button type="submit">로그아웃</button>
                    </form>
                </th:block>
            </div>
        </div>
    </header>

    <nav>
        <div class="wrapper nav-content">
            <div class="tabs">
                <a th:href="@{/posts}" class="tab" th:classappend="${menu == 'posts'} ? 'active' : ''">맛집 리뷰</a>
                <a th:href="@{/news}" class="tab" th:classappend="${menu == 'news'} ? 'active' : ''">맛집 소식</a>
                <a th:href="@{/mypage}" class="tab" th:classappend="${menu == 'mypage'} ? 'active' : ''">마이페이지</a>
            </div>
        </div>
    </nav>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>맛집 소식 상세</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/newsDetail.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div th:replace="~{layout/common :: nav-header}"></div>
<main class="detail-wrapper">

    <!-- 식당 정보 -->
    <section class="restaurant-box">
        <div class="restaurant-image">
            <img th:src="${news.restaurantImage}" alt="식당 이미지">
        </div>
        <div class="restaurant-info">
            <!--            식당 정보도 가져와야함-->
                <h1 th:text="${news.restaurantName}">맛있는 한끼 강남본점</h1>
                <div class="restaurant-category" th:switch="${news.category}">
                    <span th:case="'KOR'">한식</span>
                    <span th:case="'WST'">양식</span>
                    <span th:case="'CHN'">중식</span>
                    <span th:case="'JPN'">일식</span>
                    <span th:case="'ETC'">기타</span>
                </div>
                <div class="restaurant-detail">
                    <p th:text="'📍 ' + ${news.address}">📍 서울 강남구 테헤란로 123</p>
                    <p th:text="'☎ ' + ${news.phone}">☎ 02-1234-5678</p>
                </div>
        </div>
    </section>

    <!-- 맛집 소식 -->
    <section class="review-box">
        <div class="review-header">
            <h2 th:text="${news.title}">정말 맛있었던 인생 맛집 소식입니다!</h2>

            <div class="review-meta">
                <span>작성자 : <strong th:text="${news.nickname}">맛집탐방러</strong></span>
                <span th:text="'조회수 ' + ${news.views}">조회수 128</span>
                <span th:text="${#temporals.format(news.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-02 14:30</span>
            </div>
        </div>

        <div class="review-image">
<!--            <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=800" alt="소식 이미지">-->
            <img th:src="${news.newsImage}" alt="소식 이미지">
        </div>

        <div class="review-content" th:text="${news.content}">
            음식이 정말 맛있었고 매장 내부 분위기도 아주 깔끔하고 좋았습니다.
            <br><br>
            특히 대표 메뉴가 입에서 살살 녹을 정도로 훌륭했으며, 직원분들도 친절하셔서 다음에도 다시 방문하고 싶은 찐 맛집입니다! 추천합니다.
        </div>

        <div class="review-buttons">
            <a th:href="@{/news}" class="btn-action">목록</a>
            <th:block th:if="${session.loginMember != null and session.loginMember.memberId == news.memberId}">
                <a th:href="@{/news/{id}/edit(id=${news.id})}" class="btn-action">수정</a>
                <form th:action="@{/news/{id}/delete(id=${news.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn-action" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                </form>
            </th:block>
        </div>
    </section>
</main>
</body>
</html>

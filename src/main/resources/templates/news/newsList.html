<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <title>Byte&Bite - 맛집 소식</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/postList.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div th:replace="~{layout/common :: nav-header}"></div>
<main class="wrapper">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <div class="sort-options">
            <label>
                <input type="radio" name="sort" value="latest"
                       th:checked="${sort == 'latest'}"
                       th:onclick="|location.href='@{/news(sort=latest, category=${category})}'|"> 최신순
            </label>
            <label>
                <input type="radio" name="sort" value="views"
                       th:checked="${sort == 'views'}"
                       th:onclick="|location.href='@{/news(sort=views, category=${category})}'|"> 조회순
            </label>
        </div>
    </div>

    <!-- 검색바 -->
    <form class="search-bar" th:action="@{/news}" method="GET">
        <select class="category-select" name="category" onchange="this.form.submit()">
            <option value="all" th:selected="${category == 'all'}">전체 카테고리</option>
            <option value="KOR" th:selected="${category == 'KOR'}">한식</option>
            <option value="WST" th:selected="${category == 'WST'}">양식</option>
            <option value="CHN" th:selected="${category == 'CHN'}">중식</option>
            <option value="JPN" th:selected="${category == 'JPN'}">일식</option>
            <option value="ETC" th:selected="${category == 'ETC'}">기타</option>
        </select>

        <input type="text" class="search-input" name="keyword" placeholder="식당 이름을 입력해주세요.">

        <input type="hidden" name="sort" th:value="${sort}">

        <button type="submit" class="btn-search">검색</button>
        <th:block th:if="${session.loginMember != null and session.loginMember.role.equals('MANAGER')}">
            <a th:href="@{/news/write}" class="btn-write-link">
                <button type="button" class="btn-write">소식작성</button>
            </a>
        </th:block>
    </form>



    <!-- 3x3 카드 그리드 -->
    <section class="card-grid">
        <!-- DB에서 가져온 개수만큼 카드가 동적으로 반복 생성됩니다 -->
        <a th:each="post : ${news}"
           th:href="@{/news/{id}(id=${post.id})}"
           class="card-link">
            <div class="card">
                <div class="card-img">
                    <img th:src="@{/uploads/news/{image}(image=${post.image})}" alt="이미지">
                </div>
                <div class="card-info">
                    <div class="restaurant-name" th:text="${post.restaurantName}">식당 이름</div>
                    <div class="row">
                        <th:block th:switch="${post.category}">
                            <span th:case="'KOR'">한식</span>
                            <span th:case="'WST'">양식</span>
                            <span th:case="'CHN'">중식</span>
                            <span th:case="'JPN'">일식</span>
                            <span th:case="'ETC'">기타</span>
                        </th:block>
                        <span th:text="'조회수 ' + ${post.views}">조회수 0</span>
                    </div>
                </div>
                <div class="card-title" th:text="${post.title}">리뷰 제목</div>
            </div>
        </a>

        <!-- 데이터가 아예 없을 때 예외 처리 -->
        <div th:if="${#lists.isEmpty(news)}" style="grid-column: 1 / -1; text-align: center; padding: 50px 0; font-size: 18px; font-weight: bold;">
            등록된 소식이 없습니다.
        </div>
    </section>

    <!-- 페이지네이션 -->
    <div class="pagination" th:if="${pageResponse != null and not #lists.isEmpty(news)}">
        <!-- 이전 페이지 버튼 -->
        <a th:if="${pageResponse.hasPrev}"
           th:href="@{/news(page=${pageResponse.page - 1}, sort=${sort}, category=${category}, keyword=${keyword})}">&laquo; 이전</a>
<!--        <span th:unless="${pageResponse.hasPrev}" class="disabled">&laquo; 이전</span>-->

        <!-- 페이지 번호 목록 -->
        <th:block th:each="p : ${#numbers.sequence(pageResponse.startPage, pageResponse.endPage)}">
            <a th:if="${p != pageResponse.page}"
               th:href="@{/news(page=${p}, sort=${sort}, category=${category}, keyword=${keyword})}"
               th:text="${p}">1</a>
            <a th:if="${p == pageResponse.page}" class="active" th:text="${p}">1</a>
        </th:block>

        <!-- 다음 페이지 버튼 -->
        <a th:if="${pageResponse.hasNext}"
           th:href="@{/news(page=${pageResponse.page + 1}, sort=${sort}, category=${category}, keyword=${keyword})}">다음 &raquo;</a>
<!--        <span th:unless="${pageResponse.hasNext}" class="disabled">다음 &raquo;</span>-->
    </div>
</main>
<script>
    // 뒤로가기 캐시(BFCache) 에서 페이지를 복원했으면 페이지 새로고침
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            location.reload();
        }
    });
</script>
</body>
</html>
